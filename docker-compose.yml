version: '3'

services:
  flask_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hospital_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development
      - DATABASE_URL=mysql://hospital:hospital123@mysql_db/clinic_db
    volumes:
      - ./:/app
      - ./data/uploads:/app/uploads
    depends_on:
      - mysql_db
    networks:
      - clinic-network

  mysql_db:
    image: mysql:8.0
    container_name: hospital_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=clinic_db
      - MYSQL_USER=hospital
      - MYSQL_PASSWORD=hospital123
      - MYSQL_ROOT_PASSWORD=rootpassword
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - clinic-network

  adminer:
    image: adminer
    container_name: adminer_ui
    restart: always
    ports:
      - "8080:8080"
    networks:
      - clinic-network

volumes:
  mysql_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/mysql

  uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data/uploads

networks:
  clinic-network:
