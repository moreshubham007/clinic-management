{% extends "base.html" %}

{% block extra_css %}
<style>
/* ═══════════════════════════════════════════════
   GREEN LEAF — Modern Native UI Theme
   Inspired by Material You / iOS / Fluent Design
   ═══════════════════════════════════════════════ */
:root {
    --g50:  #f1f8e9; --g100: #dcedc8; --g200: #c5e1a5;
    --g300: #aed581; --g400: #9ccc65; --g500: #8bc34a;
    --g600: #7cb342; --g700: #558b2f; --g800: #33691e;
    --g900: #1b5e20;
    --surface: #ffffff;
    --surface2: #f8fdf4;
    --on-surface: #1a2e14;
    --on-surface-muted: #6b7c63;
    --radius-sm: 10px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-xl: 32px;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.10);
    --shadow-lg: 0 8px 32px rgba(0,0,0,0.13);
    --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
}

/* Page */
body {
    background: linear-gradient(160deg, #eaf4e0 0%, #f8fdf4 40%, #e8f5e9 100%) !important;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif !important;
    -webkit-font-smoothing: antialiased;
}

/* ── Wrapper ── */
.public-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 1rem 1rem 2rem;
}

/* ── Brand Header ── */
.pub-brand {
    background: linear-gradient(135deg, var(--g800) 0%, var(--g600) 60%, var(--g400) 100%);
    border-radius: var(--radius-lg);
    padding: 1.4rem 1.5rem;
    margin-bottom: 1.25rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    box-shadow: 0 4px 20px rgba(85,139,47,0.35);
    position: relative;
    overflow: hidden;
}
.pub-brand::after {
    content: '';
    position: absolute;
    top: -30px; right: -30px;
    width: 120px; height: 120px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
}
.pub-brand .leaf { font-size: 2.2rem; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
.pub-brand h1 { font-size: 1.15rem; font-weight: 700; color: #fff; margin: 0; letter-spacing: -0.01em; }
.pub-brand p  { font-size: 0.78rem; color: rgba(255,255,255,0.82); margin: 0.15rem 0 0; }

/* ── Nav Tabs ── */
.pub-tabs {
    display: flex;
    gap: 0.5rem;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(10px);
    border-radius: var(--radius-lg);
    padding: 0.35rem;
    margin-bottom: 1.25rem;
    box-shadow: var(--shadow-sm);
}
.pub-tab {
    flex: 1;
    padding: 0.65rem 0.5rem;
    border-radius: var(--radius-md);
    border: none;
    background: transparent;
    color: var(--on-surface-muted);
    text-align: center;
    font-weight: 600;
    font-size: 0.82rem;
    text-decoration: none;
    transition: all var(--transition);
    line-height: 1.2;
}
.pub-tab i { display: block; font-size: 1.1rem; margin-bottom: 0.2rem; }
.pub-tab.active {
    background: linear-gradient(135deg, var(--g700), var(--g500));
    color: white;
    box-shadow: 0 3px 12px rgba(85,139,47,0.4);
    text-decoration: none;
}
.pub-tab:hover:not(.active) { background: var(--g50); color: var(--g700); text-decoration: none; }

/* ── Cards ── */
.pub-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    overflow: hidden;
    margin-bottom: 1rem;
    border: 1px solid rgba(124,179,66,0.1);
}
.pub-card-header {
    background: linear-gradient(135deg, var(--g800), var(--g700));
    padding: 1rem 1.25rem;
}
.pub-card-header h5 { margin: 0; font-weight: 700; font-size: 0.95rem; color: #fff; }
.pub-card-header small { color: rgba(255,255,255,0.75); font-size: 0.78rem; }
.pub-card-body { padding: 1.25rem; }

/* ── Section Titles ── */
.form-section-title {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--g700);
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 1.5rem 0 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1.5px solid var(--g100);
}
.form-section-title:first-child { margin-top: 0; }

.step-badge {
    width: 22px; height: 22px;
    background: var(--g600);
    color: white;
    border-radius: 50%;
    font-size: 0.72rem;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

/* ── Floating-label inputs (Material / iOS style) ── */
.float-field {
    position: relative;
    margin-bottom: 1rem;
}
.float-field input,
.float-field textarea,
.float-field select {
    width: 100%;
    padding: 1.1rem 1rem 0.45rem !important;
    border: 2px solid #e0e8d8 !important;
    border-radius: var(--radius-md) !important;
    font-size: 1rem !important;
    background: var(--surface2) !important;
    color: var(--on-surface) !important;
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition) !important;
    -webkit-appearance: none;
    appearance: none;
    box-shadow: none !important;
}
.float-field select { padding: 1rem 2.5rem 0.45rem 1rem !important; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%23558b2f' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e") !important; background-repeat: no-repeat !important; background-position: right 1rem center !important; background-size: 14px !important; }
.float-field label {
    position: absolute;
    top: 50%; left: 1rem;
    transform: translateY(-50%);
    font-size: 0.95rem;
    color: var(--on-surface-muted);
    pointer-events: none;
    transition: all var(--transition);
    font-weight: 500;
    background: transparent;
    padding: 0 2px;
}
.float-field textarea ~ label { top: 1.1rem; transform: none; }
.float-field input:focus,
.float-field input:not(:placeholder-shown),
.float-field textarea:focus,
.float-field textarea:not(:placeholder-shown),
.float-field select:focus,
.float-field select:valid {
    border-color: var(--g500) !important;
    background: #fff !important;
}
.float-field input:focus ~ label,
.float-field input:not(:placeholder-shown) ~ label,
.float-field textarea:focus ~ label,
.float-field textarea:not(:placeholder-shown) ~ label {
    top: 0.35rem;
    transform: none;
    font-size: 0.7rem;
    color: var(--g700);
    font-weight: 700;
}
.float-field select:focus ~ label,
.float-field select:valid ~ label {
    top: 0.35rem;
    transform: none;
    font-size: 0.7rem;
    color: var(--g700);
    font-weight: 700;
}
.float-field input:focus,
.float-field textarea:focus,
.float-field select:focus {
    box-shadow: 0 0 0 3px rgba(139,195,74,0.18) !important;
}
.float-field .field-icon {
    position: absolute;
    right: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--g600);
    pointer-events: none;
}
.float-field textarea ~ .field-icon { top: 1.1rem; transform: none; }
.float-field input { padding-right: 2.5rem !important; }

/* ── Chip-style radio buttons ── */
.chip-group { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.25rem; }
.chip-radio { position: relative; }
.chip-radio input[type=radio] { position: absolute; opacity: 0; width: 0; height: 0; }
.chip-radio label {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.55rem 1.1rem;
    border-radius: 50px;
    border: 2px solid #d4e6c3;
    background: var(--surface2);
    color: var(--on-surface-muted);
    font-weight: 600;
    font-size: 0.88rem;
    cursor: pointer;
    transition: all var(--transition);
    white-space: nowrap;
    user-select: none;
}
.chip-radio input:checked + label {
    background: linear-gradient(135deg, var(--g700), var(--g500));
    color: white;
    border-color: transparent;
    box-shadow: 0 3px 10px rgba(85,139,47,0.4);
}
.chip-radio label:active { transform: scale(0.96); }

/* ── Card-style radio (for delivery type) ── */
.card-radio-group { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.card-radio { position: relative; }
.card-radio input[type=radio] { position: absolute; opacity: 0; width: 0; }
.card-radio label {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.1rem 0.5rem 0.85rem;
    border: 2px solid #d4e6c3;
    border-radius: var(--radius-md);
    background: var(--surface2);
    cursor: pointer;
    transition: all var(--transition);
    gap: 0.3rem;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--on-surface-muted);
    text-align: center;
}
.card-radio label .cr-icon {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--g50);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.3rem;
    color: var(--g600);
    margin-bottom: 0.2rem;
    transition: all var(--transition);
}
.card-radio input:checked + label {
    border-color: var(--g500);
    background: var(--g50);
    color: var(--g800);
    box-shadow: 0 0 0 3px rgba(139,195,74,0.2);
}
.card-radio input:checked + label .cr-icon {
    background: linear-gradient(135deg, var(--g700), var(--g500));
    color: white;
    box-shadow: 0 3px 10px rgba(85,139,47,0.4);
}

/* ── Buttons ── */
.btn-green {
    width: 100%;
    padding: 0.95rem;
    background: linear-gradient(135deg, var(--g800) 0%, var(--g600) 100%);
    color: #fff;
    border: none;
    border-radius: var(--radius-md);
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: 0 4px 16px rgba(85,139,47,0.4);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    text-decoration: none;
}
.btn-green:hover  { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(85,139,47,0.5); color: #fff; text-decoration: none; }
.btn-green:active { transform: scale(0.98); }
/* Ripple */
.btn-green::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0);
    transition: background 0.3s;
}
.btn-green:active::after { background: rgba(255,255,255,0.15); }

.btn-green-sm {
    padding: 0.6rem 1.1rem;
    background: linear-gradient(135deg, var(--g700), var(--g500));
    color: #fff;
    border: none;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    box-shadow: 0 2px 8px rgba(85,139,47,0.35);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
}
.btn-green-sm:hover { transform: translateY(-1px); color: #fff; text-decoration: none; }

.btn-ghost {
    padding: 0.75rem 1.1rem;
    background: rgba(124,179,66,0.1);
    color: var(--g700);
    border: 2px solid rgba(124,179,66,0.25);
    border-radius: var(--radius-md);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--transition);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
}
.btn-ghost:hover { background: var(--g100); color: var(--g800); text-decoration: none; }

/* ── Progress Steps ── */
.progress-steps { display: flex; align-items: flex-start; margin: 0.5rem 0 1.5rem; }
.progress-step { flex: 1; text-align: center; position: relative; }
.progress-step + .progress-step::before {
    content: '';
    position: absolute;
    top: 18px; right: 50%; left: -50%;
    height: 3px;
    background: var(--g100);
    z-index: 0;
}
.progress-step.done + .progress-step::before,
.progress-step.active + .progress-step::before { background: var(--g300); }
.progress-step .dot {
    width: 36px; height: 36px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 0.95rem;
    position: relative; z-index: 1;
    margin-bottom: 0.35rem;
    transition: all var(--transition);
}
.progress-step .label { font-size: 0.68rem; font-weight: 600; line-height: 1.2; }
.progress-step.done   .dot { background: var(--g600); color: #fff; }
.progress-step.active .dot { background: linear-gradient(135deg, var(--g700), var(--g500)); color: #fff; box-shadow: 0 0 0 5px rgba(139,195,74,0.2); }
.progress-step.idle   .dot { background: var(--g100); color: var(--g400); }
.progress-step.done   .label { color: var(--g700); }
.progress-step.active .label { color: var(--g700); font-weight: 800; }
.progress-step.idle   .label { color: #b0c4a8; }

/* ── Alerts ── */
.pub-alert-success {
    background: linear-gradient(135deg, var(--g50), #fff);
    border: 1.5px solid var(--g200);
    border-left: 4px solid var(--g500);
    border-radius: var(--radius-md);
    padding: 0.85rem 1rem;
    color: var(--g800);
}
.pub-alert-info {
    background: #e3f2fd;
    border-left: 4px solid #2196f3;
    border-radius: var(--radius-md);
    padding: 0.85rem 1rem;
    color: #1565c0;
}

/* ── Success card ── */
.success-card { text-align: center; padding: 2rem 1rem; }
.success-icon {
    width: 84px; height: 84px;
    background: linear-gradient(135deg, var(--g700), var(--g500));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1.25rem;
    font-size: 2.2rem;
    color: white;
    box-shadow: 0 8px 24px rgba(85,139,47,0.4);
}
.ref-box {
    background: var(--g50);
    border: 2px dashed var(--g400);
    border-radius: var(--radius-md);
    padding: 0.65rem 1.5rem;
    display: inline-block;
    font-size: 1.25rem;
    font-weight: 800;
    color: var(--g800);
    letter-spacing: 0.06em;
    margin: 0.75rem 0;
    font-family: 'Courier New', monospace;
}

/* ── Back link ── */
.pub-back {
    display: inline-flex; align-items: center; gap: 0.4rem;
    color: var(--g700); font-weight: 600; font-size: 0.88rem;
    text-decoration: none; margin-bottom: 1rem;
    padding: 0.4rem 0.75rem;
    background: rgba(124,179,66,0.1);
    border-radius: 50px;
    transition: all var(--transition);
}
.pub-back:hover { background: var(--g100); color: var(--g800); text-decoration: none; }

/* ── Info row (patient found) ── */
.patient-found-bar {
    display: flex; align-items: center; gap: 0.85rem;
    background: var(--surface);
    border: 1.5px solid var(--g200);
    border-left: 4px solid var(--g500);
    border-radius: var(--radius-md);
    padding: 0.85rem 1rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow-sm);
}
.patient-found-bar .avatar {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--g700), var(--g500));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 800; font-size: 1.1rem;
    flex-shrink: 0;
}
.patient-found-bar .name { font-weight: 700; color: var(--g800); font-size: 0.95rem; }
.patient-found-bar .meta { font-size: 0.78rem; color: var(--on-surface-muted); margin-top: 0.1rem; }

/* ── Divider ── */
.or-divider {
    display: flex; align-items: center; gap: 0.75rem;
    color: var(--on-surface-muted); font-size: 0.8rem; font-weight: 600;
    margin: 0.75rem 0;
}
.or-divider::before, .or-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--g100);
}

/* ── Floating submit bar (mobile) ── */
@media (max-width: 576px) {
    .pub-submit-bar {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: rgba(255,255,255,0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 0.85rem 1rem;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
        z-index: 1000;
    }
    .pub-submit-spacer { height: 80px; }
}
@media (min-width: 577px) {
    .pub-submit-bar { background: transparent; padding: 0; box-shadow: none; }
    .pub-submit-spacer { display: none; }
}

/* ── Form labels ── */
.form-label { font-weight: 600; font-size: 0.88rem; color: #444; margin-bottom: 0.4rem; }
.form-text { font-size: 0.78rem; color: var(--on-surface-muted); margin-top: 0.3rem; }

/* ── Legacy input override (for non-floating fields) ── */
.form-control, .form-select {
    border-radius: var(--radius-md) !important;
    border: 2px solid #d4e6c3 !important;
    padding: 0.8rem 1rem !important;
    font-size: 0.95rem !important;
    background: var(--surface2) !important;
    transition: all var(--transition) !important;
}
.form-control:focus, .form-select:focus {
    border-color: var(--g500) !important;
    box-shadow: 0 0 0 3px rgba(139,195,74,0.18) !important;
    background: #fff !important;
}
.input-group-text {
    border-radius: var(--radius-md) 0 0 var(--radius-md) !important;
    border: 2px solid #d4e6c3 !important;
    border-right: none !important;
    background: var(--g50) !important;
    color: var(--g700) !important;
    padding: 0.8rem 1rem !important;
}
.input-group .form-control {
    border-radius: 0 var(--radius-md) var(--radius-md) 0 !important;
    border-left: none !important;
}
</style>
{% endblock %}
