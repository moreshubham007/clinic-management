<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Test</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Modal Test</h1>
        
        <button class="btn btn-primary" onclick="showAddToWaitingModal(123, 'John Doe')">
            <i class="fas fa-plus"></i> Add to Waiting
        </button>
        
        <div class="mt-3">
            <p>This test verifies that the modal functionality works with Bootstrap 5.</p>
        </div>
    </div>

    <!-- Add to Waiting Modal -->
    <div class="modal fade" id="addToWaitingModal" tabindex="-1" aria-labelledby="addToWaitingModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addToWaitingModalLabel">Add Patient to Waiting Area</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="addToWaitingForm" method="POST" action="/waiting-area/receptionist/add-to-waiting">
                    <div class="modal-body">
                        <input type="hidden" name="appointment_id" id="appointmentId">
                        <div class="mb-3">
                            <label for="patientName" class="form-label">Patient Name</label>
                            <input type="text" class="form-control" id="patientName" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="priority" class="form-label">Priority</label>
                            <select class="form-select" name="priority" id="priority">
                                <option value="normal">Normal</option>
                                <option value="high">High</option>
                                <option value="urgent">Urgent</option>
                                <option value="low">Low</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea class="form-control" name="notes" id="notes" rows="3" placeholder="Any special notes..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary">Add to Waiting</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function showAddToWaitingModal(appointmentId, patientName) {
            console.log('Opening modal for appointment:', appointmentId, 'patient:', patientName);
            document.getElementById('appointmentId').value = appointmentId;
            document.getElementById('patientName').value = patientName;
            
            // Use Bootstrap 5 modal API
            const modal = new bootstrap.Modal(document.getElementById('addToWaitingModal'));
            modal.show();
        }

        // Test form submission
        document.getElementById('addToWaitingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            console.log('Form submitted with data:');
            for (let [key, value] of formData.entries()) {
                console.log(key + ': ' + value);
            }
            alert('Form submitted successfully! Check console for data.');
        });

        // Log when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Page loaded successfully');
            console.log('Bootstrap version:', typeof bootstrap !== 'undefined' ? '5.x' : 'Not loaded');
        });
    </script>
</body>
</html>
